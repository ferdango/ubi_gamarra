<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UbiGamarra</title>
  <meta name="description" content="Encuentra tiendas en el Emporio Comercial de Gamarra por tipo de producto, mira reseñas y llega con el mapa.">
  <meta name="theme-color" content="#33CCFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UbiGamarra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/app.css?v=9" rel="stylesheet">
</head>
<body>
  <div class="desk-caption" aria-hidden="true">
    <img src="icons/icon.svg" alt="" width="56" height="56">
    <h1>UbiGamarra</h1>
    <p>Prototipo de PWA para encontrar tiendas en el Emporio Comercial de Gamarra, Lima.</p>
    <p class="muted">Ábrela en tu celular e instálala en la pantalla de inicio para usarla como app.</p>
  </div>

  <div id="app" data-tab="mapa">
    <!-- PANTALLA 1 · MAPA -->
    <section class="screen screen-map is-active" id="screen-mapa" aria-label="Mapa">
      <div id="map" class="map"></div>

      <div class="map-top">
        <div class="map-top-row">
          <button class="round-btn avatar-btn" id="btn-menu" aria-label="Abrir menú"></button>
          <button class="search-pill" id="map-search" aria-label="Buscar tiendas">
            <span class="ico" data-i="search"></span>
            <span class="search-pill-text">¿Qué buscas en Gamarra?</span>
            <span class="search-pill-mic ico" data-i="mic" id="map-mic" role="button" aria-label="Buscar por voz"></span>
          </button>
        </div>
        <div class="chips" id="map-chips" role="tablist" aria-label="Filtrar por tipo de producto"></div>
        <div class="loc-chip" id="loc-chip"></div>
        <div class="gal-floors" id="gal-floors" role="group" aria-label="Pisos de la galería" hidden></div>
      </div>

      <div class="nav-banner" id="nav-banner" hidden></div>

      <div class="fab-col" id="fab-col">
        <button class="round-btn" id="btn-theme" aria-label="Cambiar a modo noche"><span class="ico" data-i="moon"></span></button>
        <button class="round-btn" id="btn-3d" aria-label="Vista 3D"><span class="btn-3d-text">3D</span></button>
        <button class="round-btn" id="btn-locate" aria-label="Centrar en mi ubicación"><span class="ico" data-i="locate"></span></button>
      </div>
      <button class="report-fab" id="btn-report" aria-label="Reportar algo en Gamarra"><span class="ico" data-i="megaphone"></span></button>
      <div class="speedo" id="speedo" hidden><b>4</b><small>km/h</small></div>

      <section class="sheet" id="sheet" aria-live="polite">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
    </section>

    <!-- PANTALLA 2 · BÚSQUEDA -->
    <section class="screen screen-search" id="screen-buscar" aria-label="Buscar tiendas">
      <header class="search-head">
        <h1 class="screen-title">Buscar en Gamarra</h1>
        <label class="search-box">
          <span class="ico" data-i="search"></span>
          <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
                 placeholder="Tiendas o productos: jean mom, polo pima…" aria-label="Buscar tiendas o productos">
          <button class="icon-btn" id="search-clear" aria-label="Borrar búsqueda" hidden><span class="ico" data-i="x"></span></button>
          <button class="icon-btn mic-btn" id="search-mic" aria-label="Buscar por voz"><span class="ico" data-i="mic"></span></button>
        </label>
        <div class="filter-row" id="search-filters"></div>
      </header>
      <div class="screen-scroll" id="search-results"></div>
    </section>

    <!-- GUARDADOS -->
    <section class="screen screen-saved" id="screen-guardados" aria-label="Tiendas guardadas">
      <header class="search-head">
        <h1 class="screen-title">Guardados</h1>
      </header>
      <div class="screen-scroll" id="saved-list"></div>
    </section>

    <!-- PEDIDO (carrito) -->
    <section class="screen screen-cart" id="screen-pedido" aria-label="Mi pedido">
      <header class="search-head">
        <h1 class="screen-title">Mi pedido</h1>
      </header>
      <div class="screen-scroll" id="cart-view"></div>
    </section>

    <!-- PANTALLA 3 · DETALLE DE TIENDA -->
    <section class="detail" id="detail" aria-label="Detalle de tienda" aria-hidden="true"></section>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
      <a href="#/mapa" data-tab="mapa"><span class="ico" data-i="map"></span><span>Mapa</span></a>
      <a href="#/buscar" data-tab="buscar"><span class="ico" data-i="search"></span><span>Buscar</span></a>
      <a href="#/pedido" data-tab="pedido"><span class="ico" data-i="bag"></span><span>Pedido</span><b class="badge cart-badge" hidden></b></a>
      <a href="#/guardados" data-tab="guardados"><span class="ico" data-i="heart"></span><span>Guardados</span><b class="badge" id="fav-badge" hidden></b></a>
    </nav>

    <div class="modal-root" id="modal-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>
  </div>

  <div id="mini-map-holder" hidden><div id="mini-map" class="mini-map"></div></div>

  <!-- Degradados compartidos por las ilustraciones de producto -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="ug-shine" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ug-print" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF6FB5"/><stop offset="1" stop-color="#FFB800"/>
      </linearGradient>
    </defs>
  </svg>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/catalog.js?v=8"></script>
  <script src="js/data.js?v=7"></script>
  <script src="js/galeria.js?v=1"></script>
  <script src="js/mapstyle.js?v=5"></script>
  <script src="js/garments.js?v=5"></script>
  <script src="js/payments.js?v=5"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
